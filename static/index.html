<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebShell</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6/css/xterm.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth-page">
    <div class="auth-box">
        <h1>🖥️ WebShell</h1>
        <p id="form-subtitle">登录以访问终端</p>
        <div id="error-msg" class="error"></div>
        <div id="success-msg" class="success"></div>

        <div id="login-form">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="login-username" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="login-password" placeholder="请输入密码">
            </div>
            <button class="btn btn-primary" onclick="doLogin()">登 录</button>
        </div>

        <div id="change-pw-form" style="display:none;">
            <div class="form-group">
                <label>旧密码</label>
                <input type="password" id="old-pw" placeholder="当前密码">
            </div>
            <div class="form-group">
                <label>新密码</label>
                <input type="password" id="new-pw" placeholder="新密码">
            </div>
            <button class="btn btn-primary" onclick="doChangePassword()">修改密码</button>
            <div class="toggle-link">
                <a onclick="hideChangePassword()">返回终端</a>
            </div>
        </div>
    </div>
</div>

<div id="shell-page">
    <div class="toolbar">
        <span id="user-info">用户: -</span>
        <div>
            <button class="kb-toggle" onclick="toggleKeybar()">⌨️ 按键栏</button>
            <button onclick="showChangePassword()">修改密码</button>
            <button onclick="document.getElementById('file-input').click()">上传文件</button>
            <button onclick="doLogout()">退出登录</button>
            <input type="file" id="file-input" style="display:none" onchange="doUpload(this)">
        </div>
    </div>
    <div class="keybar" id="keybar">
        <button class="key-ctrl" onclick="sendKey('Tab')">Tab</button>
        <button class="key-ctrl" onclick="sendCtrl('c')">Ctrl+C</button>
        <button class="key-ctrl" onclick="sendCtrl('d')">Ctrl+D</button>
        <button class="key-ctrl" onclick="sendCtrl('l')">Ctrl+L</button>
        <button class="key-ctrl" onclick="sendCtrl('z')">Ctrl+Z</button>
        <button class="key-ctrl" onclick="sendCtrl('a')">Ctrl+A</button>
        <button class="key-ctrl" onclick="sendCtrl('e')">Ctrl+E</button>
        <button class="key-ctrl" onclick="sendKey('Esc')">Esc</button>
        <button class="key-arrow" onclick="sendKey('ArrowUp')">↑</button>
        <button class="key-arrow" onclick="sendKey('ArrowDown')">↓</button>
        <button class="key-arrow" onclick="sendKey('ArrowLeft')">←</button>
        <button class="key-arrow" onclick="sendKey('ArrowRight')">→</button>
        <button onclick="sendKey('Home')">Home</button>
        <button onclick="sendKey('End')">End</button>
        <button class="key-fn" onclick="sendSeq('[5~')">PgUp</button>
        <button class="key-fn" onclick="sendSeq('[6~')">PgDn</button>
        <button class="key-fn" onclick="sendSeq('OP')">F1</button>
        <button class="key-fn" onclick="sendSeq('OQ')">F2</button>
        <button class="key-fn" onclick="sendSeq('OR')">F3</button>
        <button class="key-fn" onclick="sendSeq('OS')">F4</button>
    </div>
    <div id="terminal"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/lib/addon-fit.min.js"></script>
<script src="app.js"></script>
</body>
</html>
